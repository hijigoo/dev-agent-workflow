name: Cloud Agent 작업 요청
description: 요청 내용만 간단히 작성하고 필요한 경우 주의사항을 추가합니다
title: "[에이전트] "
labels: ["agent-ready"]
body:
  - type: textarea
    id: request
    attributes:
      label: 요청 내용
      description: 무엇을 왜 변경해야 하는지 간단히 작성하세요.
      placeholder: 예) 테스트 앱에서 라이트·다크 모드를 직접 전환할 수 있게 해주세요.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 주의사항
      description: 변경하면 안 되는 범위나 꼭 지켜야 할 조건이 있을 때만 작성하세요.
      placeholder: 예) Azure와 workflow는 변경하지 마세요. 없으면 비워두세요.
    validations:
      required: false
