name: Quality validation
description: Run Python, web, and browser checks with a job-specific summary.

inputs:
  summary-title:
    description: Heading for the validation summary.
    required: true
  artifact-name:
    description: Name of the uploaded evaluation artifact.
    required: true
  retention-days:
    description: Number of days to retain the evaluation artifact.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: apps/web/package-lock.json
    - name: Install Python services
      shell: bash
      run: python -m pip install -e 'apps/api[test]'
    - id: python_tests
      name: Run Python regression
      shell: bash
      run: python -m pytest apps/api/tests tests
    - name: Install web and Chromium dependencies
      shell: bash
      working-directory: apps/web
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - id: web_checks
      name: Run web lint, unit tests and build
      shell: bash
      working-directory: apps/web
      run: |
        npm run lint
        npm test
        npm run build
    - id: browser_e2e
      name: Run browser E2E
      shell: bash
      working-directory: apps/web
      run: npm run test:e2e
    - name: Write validation summary
      if: always()
      shell: bash
      env:
        SUMMARY_TITLE: ${{ inputs.summary-title }}
        PYTHON_RESULT: ${{ steps.python_tests.outcome }}
        WEB_RESULT: ${{ steps.web_checks.outcome }}
        E2E_RESULT: ${{ steps.browser_e2e.outcome }}
      run: |
        format_result() {
          case "$1" in
            success) printf '✅ 성공' ;;
            failure) printf '❌ 실패' ;;
            cancelled) printf '⏹️ 취소' ;;
            skipped|"") printf '⏭️ 미실행' ;;
            *) printf '%s' "$1" ;;
          esac
        }

        {
          echo "## $SUMMARY_TITLE"
          echo
          echo "- Commit: \`$GITHUB_SHA\`"
          echo "- Ref: \`$GITHUB_REF\`"
          echo
          echo "| 검증 | 실행 내용 | 결과 |"
          echo "|---|---|---|"
          printf '| Python regression | `pytest apps/api/tests tests` | %s |\n' \
            "$(format_result "$PYTHON_RESULT")"
          printf '| Web quality | `lint`, unit test, build | %s |\n' \
            "$(format_result "$WEB_RESULT")"
          printf '| Browser E2E | Playwright Chromium | %s |\n' \
            "$(format_result "$E2E_RESULT")"
          echo
          echo "이 요약은 이 job에서 실제 실행한 검증만 표시합니다."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload evaluation evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: warn
        path: |
          apps/web/playwright-report/
          apps/web/test-results/
        retention-days: ${{ inputs.retention-days }}
