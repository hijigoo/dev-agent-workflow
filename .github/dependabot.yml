version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/work-intake
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    labels: [dependencies, web]
    groups:
      web-runtime:
        dependency-type: production
      web-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

