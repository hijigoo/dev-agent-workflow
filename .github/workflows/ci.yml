name: "01 · PR Validation — Unit, UI, E2E, Quality"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install services
        run: python -m pip install -e 'apps/api[test]' -e 'apps/work-intake[test]'
      - name: Run tests
        run: python -m pytest apps/api/tests apps/work-intake/tests tests

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-and-quality:
    name: Browser E2E and quality evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python services
        run: python -m pip install -e 'apps/api[test]' -e 'apps/work-intake[test]'
      - name: Install web and Chromium dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: npm run test:e2e
      - name: Build sample quality scorecard
        run: |
          python scripts/build_quality_report.py \
            --input samples/quality-metrics.json \
            --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-evaluation-evidence
          if-no-files-found: warn
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            quality-report.md
          retention-days: 14
