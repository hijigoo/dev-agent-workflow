name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 18 * * 1-5"

permissions:
  contents: read

jobs:
  browser-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python services
        run: python -m pip install -e 'apps/api[test]' -e 'apps/work-intake[test]'
      - name: Install web and browser dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: npm run test:e2e
      - name: Build sample quality scorecard
        run: |
          python scripts/build_quality_report.py \
            --input samples/quality-metrics.json \
            --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          if-no-files-found: warn
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            quality-report.md
          retention-days: 14

