name: "02 · Production Deployment — Evaluate, Approve, Deploy"
run-name: "02 · MAIN · ${{ github.sha }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: "Main 1/3 · Post-merge evaluation"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/quality-validation
        with:
          summary-title: "Main 1/3 · Post-merge evaluation"
          artifact-name: post-merge-evaluation-${{ github.sha }}
          retention-days: "30"

  notify-approval:
    name: "Main 2/3 · Production approval notice"
    needs: evaluate
    if: vars.ACA_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: 연결된 Issue에 승인 링크 추가
        uses: actions/github-script@v9
        with:
          script: |
           const { owner, repo } = context.repo;
           const runUrl =
             `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
           const pulls = await github.paginate(
             github.rest.repos.listPullRequestsAssociatedWithCommit,
             {
               owner,
               repo,
               commit_sha: context.sha,
               per_page: 100,
             },
           );
           const pull = pulls
             .filter((candidate) => candidate.merged_at)
             .sort((left, right) =>
               right.merged_at.localeCompare(left.merged_at),
             )[0];

           if (!pull) {
             const message =
               "병합 commit에 연결된 PR이 없어 원본 Issue 알림을 생략합니다.";
             core.warning(message);
             await core.summary
               .addHeading("Production 배포 승인 알림")
               .addRaw(`⚠️ ${message}`)
               .write();
             return;
           }

           const result = await github.graphql(
             `query ClosingIssues(
               $owner: String!
               $repo: String!
               $number: Int!
             ) {
               repository(owner: $owner, name: $repo) {
                 pullRequest(number: $number) {
                   closingIssuesReferences(first: 20) {
                     nodes {
                       number
                     }
                   }
                 }
               }
             }`,
             { owner, repo, number: pull.number },
           );
           const issues =
             result.repository.pullRequest.closingIssuesReferences.nodes;

           if (issues.length === 0) {
             const message =
               `PR #${pull.number}에 Closes #이슈번호가 없어 ` +
               "원본 Issue 알림을 생략합니다.";
             core.warning(message);
             await core.summary
               .addHeading("Production 배포 승인 알림")
               .addRaw(`⚠️ ${message}`)
               .write();
             return;
           }

           const notified = [];
           for (const issue of issues) {
             const marker =
               `<!-- aca-deployment-approval:${context.sha}:issue-${issue.number} -->`;
             const comments = await github.paginate(
               github.rest.issues.listComments,
               { owner, repo, issue_number: issue.number, per_page: 100 },
             );
             if (comments.some((comment) => comment.body?.includes(marker))) {
               core.info(`Issue #${issue.number}에는 이미 알림이 있습니다.`);
               notified.push(`#${issue.number} (기존 댓글)`);
               continue;
             }

             await github.rest.issues.createComment({
               owner,
               repo,
               issue_number: issue.number,
               body: `${marker}
           ## 🚀 Production 배포 승인 대기

           - **PR:** #${pull.number} 병합 완료
           - **병합 후 평가:** ✅ 통과
           - **배포 revision:** \`${context.sha.slice(0, 7)}\`
           - **현재 상태:** ⏸️ 사용자 승인 대기

           [Actions에서 배포 검토하기](${runUrl})

           실제 Azure 배포는 \`production\` Environment의 승인 이후에만 시작됩니다.`,
             });
             notified.push(`#${issue.number}`);
           }

           await core.summary
             .addHeading("Production 배포 승인 알림")
             .addRaw(`승인 대기 댓글을 추가한 Issue: ${notified.join(", ")}`)
             .write();

  deploy:
    name: "Main 3/3 · Production approval and ACA deployment"
    needs: [evaluate, notify-approval]
    if: vars.ACA_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate protected deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_LOCATION"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_NAME_PREFIX"
          [[ ${#AZURE_NAME_PREFIX} -ge 3 && ${#AZURE_NAME_PREFIX} -le 18 ]]
          [[ "$AZURE_NAME_PREFIX" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify resource group and region
        run: |
          ACTUAL_LOCATION="$(az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query location \
            --output tsv)"
          test "$ACTUAL_LOCATION" = "$AZURE_LOCATION"
      - name: Deploy Container Apps foundation
        id: foundation
        run: |
          OUTPUTS="$(az deployment group create \
            --name "foundation-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/foundation.bicep \
            --parameters namePrefix="$AZURE_NAME_PREFIX" location="$AZURE_LOCATION" \
            --query properties.outputs \
            --output json)"
          echo "registry_name=$(jq -r '.registryName.value' <<<"$OUTPUTS")" >> "$GITHUB_OUTPUT"
          echo "environment_name=$(jq -r '.environmentName.value' <<<"$OUTPUTS")" >> "$GITHUB_OUTPUT"
          echo "identity_name=$(jq -r '.pullIdentityName.value' <<<"$OUTPUTS")" >> "$GITHUB_OUTPUT"
      - name: Wait for AcrPull role propagation
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
          IDENTITY_NAME: ${{ steps.foundation.outputs.identity_name }}
        run: |
          ACR_ID="$(az acr show \
            --name "$REGISTRY_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv)"
          PRINCIPAL_ID="$(az identity show \
            --name "$IDENTITY_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query principalId \
            --output tsv)"

          for attempt in 1 2 3 4 5; do
            ROLE="$(az role assignment list \
              --scope "$ACR_ID" \
              --assignee-object-id "$PRINCIPAL_ID" \
              --query "[?roleDefinitionName=='AcrPull'].roleDefinitionName" \
              --output tsv 2>/dev/null)"
            if printf '%s\n' "$ROLE" | grep -qx 'AcrPull'; then
              echo "AcrPull role confirmed."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::AcrPull role did not propagate within five minutes."
              exit 1
            fi
            echo "Waiting for AcrPull role propagation ($attempt/5)..."
            sleep 60
          done
      - name: Build immutable images in ACR
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
        run: |
          az acr build --registry "$REGISTRY_NAME" --image "meeting-api:${GITHUB_SHA}" apps/api
          az acr build --registry "$REGISTRY_NAME" --image "web:${GITHUB_SHA}" apps/web
      - name: Deploy Container Apps revision
        id: apps
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.registry_name }}
          ENVIRONMENT_NAME: ${{ steps.foundation.outputs.environment_name }}
          IDENTITY_NAME: ${{ steps.foundation.outputs.identity_name }}
        run: |
          OUTPUTS="$(az deployment group create \
            --name "apps-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/apps.bicep \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              registryName="$REGISTRY_NAME" \
              environmentName="$ENVIRONMENT_NAME" \
              pullIdentityName="$IDENTITY_NAME" \
              imageTag="$GITHUB_SHA" \
            --query properties.outputs \
            --output json)"
          echo "web_url=$(jq -r '.webUrl.value' <<<"$OUTPUTS")" >> "$GITHUB_OUTPUT"
      - name: Verify application URL
        env:
          WEB_URL: ${{ steps.apps.outputs.web_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$WEB_URL/health"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$WEB_URL/api/health"
          curl --fail --silent --show-error "$WEB_URL/" >/dev/null
          {
            echo "## Azure Container Apps deployment"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Test application: $WEB_URL"
            echo "- Approval environment: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
