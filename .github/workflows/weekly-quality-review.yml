name: "02 · Optional — Weekly Quality Review"

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: report
        name: 비식별 품질 리포트 생성
        env:
          QUALITY_METRICS_URL: ${{ vars.QUALITY_METRICS_URL }}
          QUALITY_METRICS_TOKEN: ${{ secrets.QUALITY_METRICS_TOKEN }}
        run: |
          if [ -n "$QUALITY_METRICS_URL" ]; then
            python scripts/build_quality_report.py --output quality-report.md
          else
            python scripts/build_quality_report.py \
              --input samples/quality-metrics.json \
              --output quality-report.md
          fi
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-quality-report
          path: quality-report.md
          retention-days: 30
      - name: 품질 저하 검토 Issue 생성
        if: steps.report.outputs.regression_count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const marker = `<!-- quality-review:${new Date().toISOString().slice(0, 10)} -->`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "quality-regression", per_page: 100
            });
            if (open.some(issue => issue.body?.includes(marker))) {
              core.info("이번 주 품질 검토 Issue가 이미 존재합니다.");
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title: `[품질] 주간 품질 저하 검토 ${new Date().toISOString().slice(0, 10)}`,
              labels: ["quality-regression", "needs-review"],
              body: `${marker}\n${fs.readFileSync("quality-report.md", "utf8")}

            ## 다음 단계
            집계된 근거를 검토하세요. 개선이 승인된 경우에만 별도의 Agent-ready 구현
            Issue를 생성하세요. 원문 프롬프트나 대화 내용은 공개하지 마세요.`
            });
