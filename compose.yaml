services:
  meeting-api:
    build:
      context: ./apps/api
    environment:
      MEETING_API_DATABASE: /data/meeting_rooms.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - meeting-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    environment:
      MEETING_API_ORIGIN: http://meeting-api:8000
    depends_on:
      meeting-api:
        condition: service_healthy

volumes:
  meeting-data:
